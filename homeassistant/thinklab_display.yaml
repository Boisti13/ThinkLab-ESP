# ThinkLab display – the e-paper status screen on thinklab's USB
#
# Device: ESP32-C3 "ThinkLab-esp32", <board address>, firmware
# ThinkLab-ESP (github.com/Boisti13/ThinkLab-ESP) v0.3.1 or later.
# Reads its /status.json every 60 s (basic auth, secrets
# thinklab_display_user / thinklab_display_pass): case temperature, the case
# fan (PWM duty, RPM, auto/manual), Wi-Fi, firmware, and whether the board
# still gets answers from the host service hl-hostmon over USB.
# Fan buttons: scripts calling the board's /api/fan endpoints (manual mode
# ends by itself after an hour or at 50 °C).
# Alerts go to Telegram: case too hot, fan stopped, no host answers.
# The board is on Wi-Fi, which may be switched off at night, so its
# entities are unavailable in the night window; the alerts skip it.

rest:
  - resource: http://thinklab-esp32.local/status.json
    authentication: basic
    username: !secret thinklab_display_user
    password: !secret thinklab_display_pass
    scan_interval: 60
    timeout: 10
    sensor:
      - name: ThinkLab display case temperature
        unique_id: thinklab_display_case_temperature
        value_template: "{{ value_json.case_c }}"
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
      - name: ThinkLab display fan speed
        unique_id: thinklab_display_fan_speed
        # -1 = no tach reading
        value_template: "{{ value_json.fan_rpm if value_json.fan_rpm >= 0 else none }}"
        unit_of_measurement: rpm
        state_class: measurement
        icon: mdi:fan
      - name: ThinkLab display fan duty
        unique_id: thinklab_display_fan_duty
        value_template: "{{ value_json.fan_pct if value_json.fan_pct >= 0 else none }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
      - name: ThinkLab display fan manual time left
        unique_id: thinklab_display_fan_manual_left
        value_template: "{{ value_json.fan_manual_left_s }}"
        device_class: duration
        unit_of_measurement: s
      - name: ThinkLab display host answer age
        unique_id: thinklab_display_host_answer_age
        value_template: "{{ value_json.host_age_s }}"
        device_class: duration
        unit_of_measurement: s
      - name: ThinkLab display Wi-Fi signal
        unique_id: thinklab_display_wifi_signal
        value_template: "{{ value_json.rssi_dbm }}"
        device_class: signal_strength
        unit_of_measurement: dBm
        state_class: measurement
      - name: ThinkLab display uptime
        unique_id: thinklab_display_uptime
        value_template: "{{ value_json.esp_uptime_sec }}"
        device_class: duration
        unit_of_measurement: s
      - name: ThinkLab display firmware
        unique_id: thinklab_display_firmware
        value_template: "{{ value_json.build }}"
        icon: mdi:chip
    binary_sensor:
      - name: ThinkLab display host link problem
        unique_id: thinklab_display_host_link_problem
        # true when the screen marks its data stale (no host answer for 3 minutes)
        value_template: "{{ value_json.host_stale }}"
        device_class: problem
      - name: ThinkLab display fan auto
        unique_id: thinklab_display_fan_auto
        value_template: "{{ value_json.fan_auto }}"
        icon: mdi:fan-auto

rest_command:
  thinklab_display_fan:
    # mode: "manual/25", "manual/50" or "auto"
    url: "http://thinklab-esp32.local/api/fan/{{ mode }}"
    method: post
    username: !secret thinklab_display_user
    password: !secret thinklab_display_pass
    timeout: 10

script:
  thinklab_display_fan_25:
    alias: ThinkLab display – Fan 25 %
    description: Case fan at 25 % for up to an hour (back to auto earlier at 50 °C).
    icon: mdi:fan-speed-1
    mode: single
    sequence:
      - action: rest_command.thinklab_display_fan
        data:
          mode: manual/25
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.thinklab_display_fan_duty

  thinklab_display_fan_50:
    alias: ThinkLab display – Fan 50 %
    description: Case fan at 50 % for up to an hour (back to auto earlier at 50 °C).
    icon: mdi:fan-speed-2
    mode: single
    sequence:
      - action: rest_command.thinklab_display_fan
        data:
          mode: manual/50
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.thinklab_display_fan_duty

  thinklab_display_fan_auto:
    alias: ThinkLab display – Fan auto
    description: Case fan back on the temperature curve.
    icon: mdi:fan-auto
    mode: single
    sequence:
      - action: rest_command.thinklab_display_fan
        data:
          mode: auto
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.thinklab_display_fan_duty

automation:
  - id: thinklab_display_case_hot
    alias: ThinkLab display – Tell when the case gets hot
    description: >-
      Telegram when the case temperature measured by the display's DS18B20
      stays at 50 °C or more for 10 minutes (the fan curve is at 85 % there).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.thinklab_display_case_temperature
        above: 49.9
        for: "00:10:00"
    conditions:
      # a restart or an unavailable spell re-arms numeric_state without a real crossing
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.your_telegram_chat   # change to your notify entity
        data:
          message: >-
            🌡️ ThinkLab case at {{ states('sensor.thinklab_display_case_temperature') }} °C
            for 10 minutes (fan {{ states('sensor.thinklab_display_fan_duty') }} %,
            {{ states('sensor.thinklab_display_fan_speed') }} rpm).

  - id: thinklab_display_fan_stopped
    alias: ThinkLab display – Tell when the case fan stops
    description: >-
      Telegram when the fan is driven (duty above 10 %) but its tachometer
      reads under 100 rpm for 5 minutes: stuck, unplugged or dead.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.thinklab_display_fan_speed
        below: 100
        for: "00:05:00"
      - trigger: numeric_state
        entity_id: sensor.thinklab_display_fan_duty
        above: 10
        for: "00:05:00"
    conditions:
      - condition: numeric_state
        entity_id: sensor.thinklab_display_fan_speed
        below: 100
      - condition: numeric_state
        entity_id: sensor.thinklab_display_fan_duty
        above: 10
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.your_telegram_chat   # change to your notify entity
        data:
          message: >-
            🌀 ThinkLab case fan: {{ states('sensor.thinklab_display_fan_speed') }} rpm
            at {{ states('sensor.thinklab_display_fan_duty') }} % for 5 minutes.
            Case {{ states('sensor.thinklab_display_case_temperature') }} °C.

  - id: thinklab_display_host_link_lost
    alias: ThinkLab display – Tell when the screen gets no host data
    description: >-
      Telegram when the display has had no answer from hl-hostmon on thinklab
      for 15 minutes (service stopped, USB port gone). Not in the night
      window, when the board itself is off the Wi-Fi.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.thinklab_display_host_link_problem
        to: "on"
        for: "00:15:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.wifi_night_window   # your night-window sensor, or drop this condition
        state: "off"
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.your_telegram_chat   # change to your notify entity
        data:
          message: >-
            🖥️ ThinkLab display: no data from hl-hostmon for
            {{ (states('sensor.thinklab_display_host_answer_age') | int(0) / 60) | round(0) | int }} minutes.
            Check `systemctl status hl-hostmon` on pve_thinklab.
